# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot


# AndroidX package structure
android.useAndroidX=true

# Non-transitive R classes
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# BuildConfig is enabled per-module (only :app uses it)

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Chaquopy build interpreter (R-E.1) is intentionally NOT committed: it is
# machine-specific. Configure it locally instead, e.g.
#   -Psocialdl.python.buildPython=C:/path/to/python.exe
#   SOCIALDL_PYTHON=C:/path/to/python.exe
# or add the property to ~/.gradle/gradle.properties. When unset, Chaquopy uses
# `python` from PATH (CI sets up Python 3.11).
